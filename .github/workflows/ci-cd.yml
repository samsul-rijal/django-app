name: CI/CD for Django + Docker

on:
  push:
    branches: [ master ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/myproject:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_KEY }}
          script: |
            # Step 1: Pull the latest Docker image
            docker pull ${{ secrets.DOCKER_USERNAME }}/myproject:latest

            # Step 2: Stop and remove any previous container
            docker-compose -f /path/to/your/docker-compose.yml down || true

            # Step 3: Clean up any unused Docker resources
            docker system prune -af || true

            # Step 4: Restart the services using Docker Compose
            docker-compose -f /path/to/your/docker-compose.yml up -d

