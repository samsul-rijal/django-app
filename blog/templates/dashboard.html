{% extends "base.html" %}

{% block title %}Dashboard{% endblock %}

{% block content %}
<div class="content">
    <h1 class="pb-3">Dashboard</h1>
    <div class="d-flex justify-content-center gap-5">
        <div class="card " style="width: 250px;">
            <div class="d-flex flex-column align-items-center gap-2 p-5">
                <i class="fa-solid fa-box-open text-danger" style="font-size: 42px;"></i>
                <p style="font-size: 32px; margin: 0; font-weight: 500;">1200</p>
                <span style="color: #a19f9f;">products</span>
            </div>
        </div>
        <div class="card " style="width: 250px;">
            <div class="d-flex flex-column align-items-center gap-2 p-5">
                <i class="fa-solid fa-user text-primary" style="font-size: 42px;"></i>
                <p style="font-size: 32px; margin: 0; font-weight: 500;">{{total_users}}</p>
                <span style="color: #a19f9f;">users</span>
            </div>
        </div>
        <div class="card " style="width: 250px;">
            <div class="d-flex flex-column align-items-center gap-2 p-5">
                <i class="fa-solid fa-users text-warning" style="font-size: 42px;"></i>
                <p style="font-size: 32px; margin: 0; font-weight: 500;">500</p>
                <span style="color: #a19f9f;">members</span>
            </div>
        </div>
    </div>
</div>
  
{% endblock %}
